appId: ir.tgbs.peccharge.web
---

- tapOn: 
   id: "main"
- tapOn: 
   id: "mobileNumber"
- inputText: ${PHONE_BILL_NUMBER}

- tapOn: 
    id: "submit"

- assertVisible: "اطلاعات قبض"
- back
- runFlow:
    when:
       visible: "اطلاعات قبض"
    commands: 
      - back

- tapOn: 
   id: "save"
- runFlow:
    when:
      visible: "نام قبض"
    file: saveBill.yaml
- runFlow:
    when:
       visible: "تلفن ثابت"
    commands: 
        - back
