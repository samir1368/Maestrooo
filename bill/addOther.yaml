appId: ${APP_ID}
---
- tapOn: 
   id: "main"
- assertVisible:
    id: "recyclerView"
- tapOn: "پرداخت با شناسه"
 
- tapOn: 
   id: "edtBillId"
- inputText: ${OTHER_BILL_ID}
- tapOn: 
   id: "payId"
- inputText: ${OTHER_PAYMENT_ID}
- tapOn: 
    id: "submit"
- back

- tapOn: 
   id: "save"
- assertVisible: "نام قبض"
- runFlow: saveBill.yaml
- back
- tapOn:
    id: "btn6"
- tapOn: 
   id: "main"
- tapOn: "جریمه وسایل نقلیه"
- tapOn: 
   id: "edtBillId"
- inputText: ${VEHICLE_FINE_BILL_ID}
- tapOn: 
   id: "payId"
- inputText: ${VEHICLE_FINE_PAYMENT_ID}
- tapOn: 
    id: "submit"
- assertVisible:
    id: "container"
- extendedWaitUntil:
    visible:
      id: "submit"
    timeout: 3000

- back
- runFlow:
    when:
       visible: "جریمه وسایل نقلیه"
   
    commands:
      - back
- tapOn:
    id: "btn6"
- tapOn: 
   id: "main"
- tapOn: "عوارض ملکی"

