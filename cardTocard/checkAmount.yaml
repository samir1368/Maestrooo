appId: ir.tgbs.peccharge.web
---


- tapOn:
    id: "amountView"
- inputText: ${INVALID_LOW_AMOUNT}

- tapOn:
    id: "butonEstelam"
- assertVisible:
    id: "sheet_constraint_layout"
- tapOn:
    id: "cancel"

- tapOn:
    id: "amountView"
- eraseText
- inputText: ${INVALID_HIGH_AMOUNT}
- tapOn:
    id: "butonEstelam"

- assertVisible:
    id: "sheet_constraint_layout"
- tapOn:
    id: "cancel"

- tapOn:
    id: "amountView"
- eraseText
- inputText: ${TRANSFER_AMOUNT}
