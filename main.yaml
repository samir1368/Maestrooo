appId: ir.tgbs.peccharge.web
---
##- runFlow: login.yaml

- runFlow:
    when:
      visible:
        id: "cancel"
    commands: 
        - tapOn:
            id: "cancel"
# card to card
- assertVisible:
    id: "right_icon"
    index: 0
- runFlow: cardTocard/cardTocard.yaml
#remain service
- assertVisible:
    id: "mid_button"
    index: 1
- runFlow: remain/remian.yaml
# charge
- assertVisible:
    id: "left_button"
    index: 0
- runFlow: charge/charge.yaml

#package service
- assertVisible:
    id: "left_button"
    index: 1
- runFlow: package/package.yaml
#bill service
- assertVisible:
    id: "mid_button"
- runFlow: bill/billList.yaml




